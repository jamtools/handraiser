name: CI

on:
  pull_request:
  push:
    branches:
    - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install modules
      run: pnpm i

    - name: Build app
      run: SPRINGBOARD_PLATFORM_VARIANT=main pnpm run build

    - name: Find and upload npm logs
      if: failure()
      run: |
        mkdir -p artifacts/npm-logs
        find ~/.npm/_logs -type f -name "*.log" -exec cp {} artifacts/npm-logs/ \;
      shell: bash

    - name: Upload npm logs artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: npm-logs
        path: artifacts/npm-logs/

  types:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install modules
      run: pnpm i

    - name: Check Types
      run: pnpm run check-types
